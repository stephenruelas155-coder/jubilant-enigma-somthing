<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Steve's Rentals</title>

    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-dark bg-dark px-3">
            <a class="navbar-brand"> Steve's Rentals</a>
            <input id="searchBox" class="form-control w-50" type="search" placeholder="Search cars">
            <div>
                <span id="userGreeting" class="text-white me-3"></span>
                <a href="pages/login.html" id="btnLogin" class="btn btn-light ms-sm-3 d-none">
                    <i class="bi bi-person"></i> Hello, sign in
                </a>
                <button id="btnLogout" class="btn btn-danger ms-2 d-none">
                    Logout
                </button>

        </nav>
    </header>

    <section class="hero-banner mb-4"></section>

    <div class='content'>
        <h2>Welcome to Steve's Car Rentals</h2>

    </div>

    <div id="carGrid" class="car-grid"></div>

    <footer class="bg-dark text-white text-center p-3 mt-5">
        <a href="https://github.com/stephenruelas155-coder/jubilant-enigma-somthing"

            &lt; <i class="bi bi-github"></i> source code &gt;
        </a>
        <p>© 2026 Steve's Rentals</p>

        <a href="https://github.com/stephenruelas155-coder" class="" target="_blank">
            <i class="bi bi-github"></i>
            <i class="bi bi-person"></i>
            GitHub Profile
        </a>
    </footer>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3">
    </div>

    <script src="scripts/search.js"></script>
    <script src="scripts/session.js"></script>
    <script src="scripts/login-logout.js"></script>

</body>

</html>
